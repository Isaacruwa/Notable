<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kiver Announcement Queue</title><link rel="stylesheet" href="/app.css"><style>
body{background:#faf9f6}.queue{max-width:980px;margin:auto;padding:56px 24px 100px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.head h1{font-size:48px;letter-spacing:-.05em;margin:4px 0}.muted{color:#777}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d9d5ce;background:#fff;color:#171717;border-radius:9px;padding:10px 14px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none}.btn.dark{background:#171717;color:#fff}.keybox{display:flex;gap:8px;margin:20px 0 30px}.keybox input{flex:1;max-width:360px;padding:12px;border:1px solid #d9d5ce;border-radius:9px;font:inherit}.notice{padding:13px 15px;border:1px solid #e5e2dc;border-radius:10px;background:#fff;margin-bottom:16px}.error{border-color:#efd1d1;background:#fff4f4;color:#8a4141}.rows{display:grid;gap:12px}.row{display:grid;grid-template-columns:86px 1fr auto;gap:16px;align-items:center;border:1px solid #e5e2dc;border-radius:14px;background:#fff;padding:14px}.logo{width:86px;height:86px;border-radius:12px;overflow:hidden;background:#f0eeea;display:grid;place-items:center;font-weight:850;font-size:28px}.logo img{width:100%;height:100%;object-fit:cover}.row h2{margin:0 0 5px;font-size:19px}.handle{font-size:13px;color:#555;margin-bottom:7px}.about{font-size:14px;color:#555;line-height:1.45}.post{white-space:nowrap}.count{font-size:13px;color:#777;margin-bottom:16px}@media(max-width:700px){.head{align-items:start;flex-direction:column}.row{grid-template-columns:64px 1fr}.logo{width:64px;height:64px}.post{grid-column:1/-1}.keybox{flex-direction:column}.keybox input{max-width:none}}
</style></head><body><header class="nav"><a class="brand" href="/admin">Kiver</a><a class="nav-link" href="/admin">Back to admin</a></header><main class="queue"><div class="head"><div><span class="eyebrow">ANNOUNCEMENT QUEUE</span><h1>Pending listings.</h1><p class="muted">Only listings that have not been posted to the Kiver announcement channel appear here.</p></div></div><div class="keybox"><input id="key" type="password" inputmode="numeric" autocomplete="off" placeholder="Admin key"><button class="btn dark" id="load">Open queue</button></div><div id="notice" class="notice" hidden></div><div id="count" class="count"></div><div id="rows" class="rows"></div></main><script>
const API="https://kiver-listing-bot.onrender.com/admin/queue";const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));let key=sessionStorage.getItem("kiver_queue_key")||"";$("#key").value=key;
function msg(text,error=false){const n=$("#notice");n.textContent=text;n.className="notice"+(error?" error":"");n.hidden=!text}
async function api(method,body){const r=await fetch(API,{method,headers:{"x-kiver-admin-key":key,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Queue request failed.");return d}
async function load(){if(!key){msg("Enter the admin key.",true);return}sessionStorage.setItem("kiver_queue_key",key);try{msg("");const d=await api("GET");const rows=d.listings||[];$("#count").textContent=rows.length?rows.length+" pending listing"+(rows.length===1?"":"s"):"No pending listings.";$("#rows").innerHTML=rows.map(b=>'<article class="row"><div class="logo">'+(b.image_url?'<img src="'+esc(b.image_url)+'" alt="">':esc((b.name||"B").charAt(0)))+'</div><div><h2>'+esc(b.name||"Telegram Bot")+'</h2><div class="handle">@'+esc(b.telegram_username||"")+'</div><div class="about">'+esc(b.about||b.description||"")+'</div></div><div class="post"><button class="btn dark" data-post="'+esc(b.id)+'">Post to @GetKiver</button></div></article>').join("");bind()}catch(e){$("#rows").innerHTML="";$("#count").textContent="";msg(e.message,true)}}
function bind(){document.querySelectorAll("[data-post]").forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent="Posting...";try{await api("POST",{listingId:b.dataset.post});await load()}catch(e){b.disabled=false;b.textContent="Post to @GetKiver";msg(e.message,true)}})}
$("#load").onclick=load;$("#key").addEventListener("keydown",e=>{if(e.key==="Enter")load()});if(key)load();
</script></body></html>
