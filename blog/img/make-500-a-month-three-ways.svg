<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">Three ways to reach about $500 a month</title><desc id="d">Illustrative examples at about $0.013 per Star: 154 subscribers paying 250 Stars, 77 buyers of a 500 Star pack, or 770 purchases of a 50 Star item each reach about 38,500 Stars, roughly $500 a month.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="330" rx="20" fill="#fff" stroke="#e7e5df"/><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">Three ways to reach about $500 a month</text><rect x="40" y="84" width="700" height="54" rx="14" fill="#f3f1ed"/><text x="62" y="118" font-size="18" font-weight="800" fill="#171717">Subscription bot</text><text x="720" y="118" text-anchor="end" font-size="16" fill="#171717">154 subscribers × 250 Stars a month</text><rect x="40" y="154" width="700" height="54" rx="14" fill="#f3f1ed"/><text x="62" y="188" font-size="18" font-weight="800" fill="#171717">Premium AI pack</text><text x="720" y="188" text-anchor="end" font-size="16" fill="#171717">77 buyers × 500 Stars a month</text><rect x="40" y="224" width="700" height="54" rx="14" fill="#f3f1ed"/><text x="62" y="258" font-size="18" font-weight="800" fill="#171717">Mini App game</text><text x="720" y="258" text-anchor="end" font-size="16" fill="#171717">770 purchases × 50 Stars a month</text><rect x="770" y="84" width="190" height="194" rx="18" fill="#6964ff"/><text x="865" y="168" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">≈ $500</text><text x="865" y="196" text-anchor="middle" font-size="14" fill="#fff" opacity=".85">38,500 Stars</text><text x="865" y="218" text-anchor="middle" font-size="14" fill="#fff" opacity=".85">a month</text><text x="40" y="310" font-size="13" fill="#66645f">Illustrative, at about $0.013 per Star to developers. Telegram can change this rate.</text></svg>
