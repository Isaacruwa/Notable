<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">How to validate Telegram Mini App initData</title><desc id="d">Four step diagram: receive the initData string, remove the hash and sort the remaining fields into key=value lines, sign them with HMAC-SHA256 using a key derived from the bot token, then compare with the hash and reject stale auth_date values.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="330" rx="20" fill="#fff" stroke="#e7e5df"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171717"/></marker></defs><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">Validate initData on your server</text><rect x="40" y="100" width="200" height="130" rx="18" fill="#f3f1ed"/><text x="140" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#171717">1  Receive</text><text x="140" y="178" text-anchor="middle" font-size="13" fill="#171717" opacity=".8">initData string sent</text><text x="140" y="197" text-anchor="middle" font-size="13" fill="#171717" opacity=".8">by your Mini App</text><line x1="244" y1="165" x2="276" y2="165" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><rect x="280" y="100" width="200" height="130" rx="18" fill="#f3f1ed"/><text x="380" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#171717">2  Prepare</text><text x="380" y="178" text-anchor="middle" font-size="13" fill="#171717" opacity=".8">Remove hash, sort keys,</text><text x="380" y="197" text-anchor="middle" font-size="13" fill="#171717" opacity=".8">join as key=value lines</text><line x1="484" y1="165" x2="516" y2="165" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><rect x="520" y="100" width="200" height="130" rx="18" fill="#6964ff"/><text x="620" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3  Sign</text><text x="620" y="178" text-anchor="middle" font-size="13" fill="#fff" opacity=".8">HMAC-SHA256 with a key</text><text x="620" y="197" text-anchor="middle" font-size="13" fill="#fff" opacity=".8">derived from the bot token</text><line x1="724" y1="165" x2="756" y2="165" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><rect x="760" y="100" width="200" height="130" rx="18" fill="#171717"/><text x="860" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4  Compare</text><text x="860" y="178" text-anchor="middle" font-size="13" fill="#fff" opacity=".8">Hash must match; also</text><text x="860" y="197" text-anchor="middle" font-size="13" fill="#fff" opacity=".8">reject an old auth_date</text><text x="500" y="268" text-anchor="middle" font-size="14" fill="#66645f">Do this on your server. Never put your bot token in the Mini App front-end.</text><text x="500" y="292" text-anchor="middle" font-size="14" fill="#66645f">initDataUnsafe in the browser can be edited by anyone, so use it for display only.</text></svg>