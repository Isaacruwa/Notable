<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">How a screenshot signal bot works</title><desc id="d">Diagram: you send a chart screenshot in Telegram, the AI bot analyzes the structures on it, and a signal comes back in the same chat. No keys or passwords are needed.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="330" rx="20" fill="#fff" stroke="#e7e5df"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171717"/></marker></defs><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">How a screenshot signal bot works</text><rect x="40" y="110" width="180" height="120" rx="18" fill="#f3f1ed"/><text x="130" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#171717">You</text><text x="130" y="192" text-anchor="middle" font-size="13" fill="#171717" opacity=".75">send a chart screenshot</text><rect x="286" y="110" width="180" height="120" rx="18" fill="#6964ff"/><text x="376" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">Telegram</text><text x="376" y="192" text-anchor="middle" font-size="13" fill="#fff" opacity=".75">the bot chat</text><rect x="532" y="110" width="180" height="120" rx="18" fill="#171717"/><text x="622" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">AI bot</text><text x="622" y="192" text-anchor="middle" font-size="13" fill="#fff" opacity=".75">reads the chart structures</text><rect x="778" y="110" width="180" height="120" rx="18" fill="#f3f1ed"/><text x="868" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#171717">Your signal</text><text x="868" y="192" text-anchor="middle" font-size="13" fill="#171717" opacity=".75">arrives in the same chat</text><line x1="222" y1="170" x2="284" y2="170" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="253" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">1 send</text><line x1="468" y1="170" x2="530" y2="170" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="499" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">2 analyze</text><line x1="714" y1="170" x2="776" y2="170" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="745" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">3 signal</text><text x="500" y="290" text-anchor="middle" font-size="14" fill="#66645f">No API keys, no passwords, no access to your accounts. You make the call.</text></svg>
