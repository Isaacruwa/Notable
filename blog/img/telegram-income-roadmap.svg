<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d"><title id="t">Roadmap from zero to first income on Telegram</title><desc id="d">Five steps: pick a niche, give value for free, find your first 100 users, add one offer, then measure and repeat.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="290" rx="20" fill="#fff" stroke="#e7e5df"/><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">From zero to first income: a simple roadmap</text><line x1="120" y1="150" x2="880" y2="150" stroke="#e7e5df" stroke-width="4"/><circle cx="120" cy="150" r="30" fill="#6964ff"/><text x="120" y="159" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">1</text><text x="120" y="216" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Pick a niche</text><text x="120" y="242" text-anchor="middle" font-size="13" fill="#66645f">One topic, one audience</text><circle cx="310" cy="150" r="30" fill="#6964ff"/><text x="310" y="159" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">2</text><text x="310" y="216" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Give value free</text><text x="310" y="242" text-anchor="middle" font-size="13" fill="#66645f">Channel, bot or posts</text><circle cx="500" cy="150" r="30" fill="#6964ff"/><text x="500" y="159" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">3</text><text x="500" y="216" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Find first 100</text><text x="500" y="242" text-anchor="middle" font-size="13" fill="#66645f">Directories, communities, links</text><circle cx="690" cy="150" r="30" fill="#6964ff"/><text x="690" y="159" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">4</text><text x="690" y="216" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Add one offer</text><text x="690" y="242" text-anchor="middle" font-size="13" fill="#66645f">Ads, paid tier or product</text><circle cx="880" cy="150" r="30" fill="#171717"/><text x="880" y="159" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">5</text><text x="880" y="216" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Measure and repeat</text><text x="880" y="242" text-anchor="middle" font-size="13" fill="#66645f">Keep what converts</text></svg>