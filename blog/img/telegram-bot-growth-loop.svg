<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-labelledby="t d"><title id="t">Growth loop for a Telegram bot</title><desc id="d">A loop: a user uses the bot, shares it with a deep link, a friend arrives and presses start, gets value and shares too.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="310" rx="20" fill="#fff" stroke="#e7e5df"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171717"/></marker></defs><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">A simple growth loop for a Telegram bot</text><rect x="40" y="100" width="196" height="104" rx="18" fill="#f3f1ed"/><text x="138.0" y="148.0" text-anchor="middle" font-size="22" font-weight="800" fill="#171717">Use the bot</text><text x="138.0" y="174.0" text-anchor="middle" font-size="13" fill="#171717" opacity=".75">gets a result</text><line x1="238" y1="152" x2="274" y2="152" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><rect x="276" y="100" width="196" height="104" rx="18" fill="#6964ff"/><text x="374.0" y="148.0" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Share it</text><text x="374.0" y="174.0" text-anchor="middle" font-size="13" fill="#fff" opacity=".75">via a deep link</text><line x1="474" y1="152" x2="510" y2="152" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><rect x="512" y="100" width="196" height="104" rx="18" fill="#171717"/><text x="610.0" y="148.0" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Friend arrives</text><text x="610.0" y="174.0" text-anchor="middle" font-size="13" fill="#fff" opacity=".75">presses /start</text><line x1="710" y1="152" x2="746" y2="152" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><rect x="748" y="100" width="196" height="104" rx="18" fill="#f3f1ed"/><text x="846.0" y="148.0" text-anchor="middle" font-size="22" font-weight="800" fill="#171717">Friend gets value</text><text x="846.0" y="174.0" text-anchor="middle" font-size="13" fill="#171717" opacity=".75">and shares too</text><path d="M 842 206 L 842 252 L 138 252 L 138 208" fill="none" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="490" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#66645f">Every happy user becomes a new entry point</text></svg>