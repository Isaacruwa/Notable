<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d"><title id="t">BotFather commands cheat sheet</title><desc id="d">Six BotFather commands: newbot, setname, setdescription, setuserpic, setcommands and revoke, each with a short description.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="350" rx="20" fill="#fff" stroke="#e7e5df"/><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">BotFather cheat sheet</text><rect x="40" y="86" width="288" height="104" rx="16" fill="#faf9f7" stroke="#e7e5df"/><text x="62" y="128" font-size="22" font-weight="800" fill="#6964ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/newbot</text><text x="62" y="158" font-size="14" fill="#66645f">Create a bot and get its token</text><rect x="348" y="86" width="288" height="104" rx="16" fill="#faf9f7" stroke="#e7e5df"/><text x="370" y="128" font-size="22" font-weight="800" fill="#6964ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/setname</text><text x="370" y="158" font-size="14" fill="#66645f">Change the display name</text><rect x="656" y="86" width="288" height="104" rx="16" fill="#faf9f7" stroke="#e7e5df"/><text x="678" y="128" font-size="22" font-weight="800" fill="#6964ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/setdescription</text><text x="678" y="158" font-size="14" fill="#66645f">Text shown before the first /start</text><rect x="40" y="210" width="288" height="104" rx="16" fill="#faf9f7" stroke="#e7e5df"/><text x="62" y="252" font-size="22" font-weight="800" fill="#6964ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/setuserpic</text><text x="62" y="282" font-size="14" fill="#66645f">Upload the bot profile photo</text><rect x="348" y="210" width="288" height="104" rx="16" fill="#faf9f7" stroke="#e7e5df"/><text x="370" y="252" font-size="22" font-weight="800" fill="#6964ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/setcommands</text><text x="370" y="282" font-size="14" fill="#66645f">Define the / command menu</text><rect x="656" y="210" width="288" height="104" rx="16" fill="#faf9f7" stroke="#e7e5df"/><text x="678" y="252" font-size="22" font-weight="800" fill="#6964ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/revoke</text><text x="678" y="282" font-size="14" fill="#66645f">Issue a new token if one leaks</text></svg>