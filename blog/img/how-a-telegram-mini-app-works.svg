<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d"><title id="t">How a Telegram Mini App works</title><desc id="d">Diagram: the Telegram app opens your Mini App page over HTTPS and passes signed initData, the page sends initData to your server with each request, and your server validates it and returns data that the page shows inside Telegram.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="320" rx="20" fill="#fff" stroke="#e7e5df"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171717"/></marker></defs><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">How a Telegram Mini App works</text><rect x="40" y="110" width="220" height="120" rx="18" fill="#f3f1ed"/><text x="150" y="166" text-anchor="middle" font-size="22" font-weight="800" fill="#171717">Telegram app</text><text x="150" y="192" text-anchor="middle" font-size="13" fill="#171717" opacity=".75">user taps a button</text><rect x="390" y="110" width="220" height="120" rx="18" fill="#6964ff"/><text x="500" y="166" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Your Mini App</text><text x="500" y="192" text-anchor="middle" font-size="13" fill="#fff" opacity=".75">web page on HTTPS</text><rect x="740" y="110" width="220" height="120" rx="18" fill="#171717"/><text x="850" y="166" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Your server</text><text x="850" y="192" text-anchor="middle" font-size="13" fill="#fff" opacity=".75">validates initData</text><line x1="262" y1="150" x2="388" y2="150" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="325" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">1 opens your URL</text><line x1="612" y1="150" x2="738" y2="150" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="675" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">2 sends initData</text><line x1="738" y1="196" x2="612" y2="196" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="675" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">3 returns data</text><line x1="388" y1="196" x2="262" y2="196" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="325" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">4 shows the UI</text><text x="500" y="290" text-anchor="middle" font-size="14" fill="#66645f">Telegram injects window.Telegram.WebApp once your page loads telegram-web-app.js.</text></svg>