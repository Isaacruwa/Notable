<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d"><title id="t">Telegram bot growth funnel</title><desc id="d">Funnel from finding a bot to opening it, pressing start, getting a first result, coming back and inviting a friend, with the main thing to improve at each step.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="500" rx="20" fill="#fff" stroke="#e7e5df"/><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">The bot growth funnel (and what to fix at each step)</text><rect x="40.0" y="86" width="560" height="46" rx="12" fill="#6964ff"/><text x="320" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Find it</text><text x="632" y="115" font-size="14" fill="#66645f">Directory listing, search, communities</text><rect x="85.0" y="144" width="470" height="46" rx="12" fill="#7a76ff"/><text x="320" y="173" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Open the chat</text><text x="632" y="173" font-size="14" fill="#66645f">Clear name, one-line description, photo</text><rect x="130.0" y="202" width="380" height="46" rx="12" fill="#5b57e6"/><text x="320" y="231" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Press /start</text><text x="632" y="231" font-size="14" fill="#66645f">Short, friendly welcome message</text><rect x="175.0" y="260" width="290" height="46" rx="12" fill="#3f3cc0"/><text x="320" y="289" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Get a first result</text><text x="632" y="289" font-size="14" fill="#66645f">Deliver value in under a minute</text><rect x="220.0" y="318" width="200" height="46" rx="12" fill="#26244f"/><text x="320" y="347" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Come back</text><text x="632" y="347" font-size="14" fill="#66645f">Reminders, updates, a channel</text><rect x="255.0" y="376" width="130" height="46" rx="12" fill="#171717"/><text x="320" y="405" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Invite a friend</text><text x="632" y="405" font-size="14" fill="#66645f">Deep links and share buttons</text><text x="40" y="456" font-size="13" fill="#8a8883">Illustrative funnel shape, not measured data. Every bot loses people at each step; your job is to find the biggest drop.</text></svg>