<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d"><title id="t">How Telegram Stars turn into cash</title><desc id="d">Five steps: a customer pays in Stars, the Stars land in your bot or channel balance, they wait 21 days, you withdraw on Fragment, then convert TON to cash.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="290" rx="20" fill="#fff" stroke="#e7e5df"/><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">How Telegram Stars turn into cash</text><line x1="120" y1="140" x2="880" y2="140" stroke="#e7e5df" stroke-width="4"/><circle cx="120" cy="140" r="30" fill="#6964ff"/><text x="120" y="149" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">1</text><text x="120" y="206" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Customer pays</text><text x="120" y="232" text-anchor="middle" font-size="13" fill="#66645f">In your bot, app or channel</text><circle cx="310" cy="140" r="30" fill="#6964ff"/><text x="310" y="149" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">2</text><text x="310" y="206" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Stars arrive</text><text x="310" y="232" text-anchor="middle" font-size="13" fill="#66645f">In your bot or channel balance</text><circle cx="500" cy="140" r="30" fill="#6964ff"/><text x="500" y="149" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">3</text><text x="500" y="206" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">21-day hold</text><text x="500" y="232" text-anchor="middle" font-size="13" fill="#66645f">Each Star matures after 21 days</text><circle cx="690" cy="140" r="30" fill="#6964ff"/><text x="690" y="149" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">4</text><text x="690" y="206" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Withdraw</text><text x="690" y="232" text-anchor="middle" font-size="13" fill="#66645f">On Fragment, 1,000 Stars minimum</text><circle cx="880" cy="140" r="30" fill="#171717"/><text x="880" y="149" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">5</text><text x="880" y="206" text-anchor="middle" font-size="17" font-weight="800" fill="#171717">Cash out</text><text x="880" y="232" text-anchor="middle" font-size="13" fill="#66645f">TON to wallet, exchange, bank</text></svg>