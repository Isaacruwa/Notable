<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" width="1000" height="552" role="img" aria-labelledby="t d"><title id="t">Seven ways to launch a Telegram Mini App</title><desc id="d">Table comparing the seven launch methods for Telegram Mini Apps: main Mini App, direct link, menu button, inline button, keyboard button, inline mode and attachment menu, with where users see each and what it is good for.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="552" rx="20" fill="#fff" stroke="#e7e5df"/><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">Seven ways to launch a Telegram Mini App</text><rect x="40" y="76" width="920" height="40" rx="10" fill="#171717"/><text x="60" y="101" font-size="13" font-weight="700" fill="#fff">Launch method</text><text x="290" y="101" font-size="13" font-weight="700" fill="#fff">Where users see it</text><text x="610" y="101" font-size="13" font-weight="700" fill="#fff">Good for</text><rect x="40" y="116" width="920" height="56" fill="#f3f1ed"/><text x="60" y="150" font-size="15" font-weight="800" fill="#171717">Main Mini App</text><text x="290" y="150" font-size="14" fill="#171717">"Launch app" button on the bot profile</text><text x="610" y="150" font-size="14" fill="#66645f">Full web services, one tap from the profile</text><text x="60" y="206" font-size="15" font-weight="800" fill="#171717">Direct link</text><text x="290" y="206" font-size="14" fill="#171717">t.me/bot/appname?startapp=...</text><text x="610" y="206" font-size="14" fill="#66645f">Opening in any chat, shared or group use</text><rect x="40" y="228" width="920" height="56" fill="#f3f1ed"/><text x="60" y="262" font-size="15" font-weight="800" fill="#171717">Menu button</text><text x="290" y="262" font-size="14" fill="#171717">Menu button in the bot chat</text><text x="610" y="262" font-size="14" fill="#66645f">Same as an inline button, quicker to reach</text><text x="60" y="318" font-size="15" font-weight="800" fill="#171717">Inline button</text><text x="290" y="318" font-size="14" fill="#171717">Button under a bot message</text><text x="610" y="318" font-size="14" fill="#66645f">Full web services and integrations</text><rect x="40" y="340" width="920" height="56" fill="#f3f1ed"/><text x="60" y="374" font-size="15" font-weight="800" fill="#171717">Keyboard button</text><text x="290" y="374" font-size="14" fill="#171717">Custom keyboard in the chat</text><text x="610" y="374" font-size="14" fill="#66645f">Data input; sends text back to the bot</text><text x="60" y="430" font-size="15" font-weight="800" fill="#171717">Inline mode</text><text x="290" y="430" font-size="14" fill="#171717">Button in inline query results</text><text x="610" y="430" font-size="14" fill="#66645f">Build content, then send it to a chat</text><rect x="40" y="452" width="920" height="56" fill="#f3f1ed"/><text x="60" y="486" font-size="15" font-weight="800" fill="#171717">Attachment menu</text><text x="290" y="486" font-size="14" fill="#171717">Paperclip menu in any chat</text><text x="610" y="486" font-size="14" fill="#66645f">Currently limited to major Telegram advertisers</text><text x="500" y="536" text-anchor="middle" font-size="12" fill="#66645f">Source: Telegram Mini Apps documentation (core.telegram.org/bots/webapps).</text></svg>