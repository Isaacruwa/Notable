<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d"><title id="t">How a Telegram bot works</title><desc id="d">Diagram: a user sends a message to Telegram, Telegram passes the update to your server by polling or webhook, and your server replies through the Bot API.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="320" rx="20" fill="#fff" stroke="#e7e5df"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#171717"/></marker></defs><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">How a Telegram bot works</text><rect x="40" y="110" width="220" height="120" rx="18" fill="#f3f1ed"/><text x="150.0" y="166.0" text-anchor="middle" font-size="22" font-weight="800" fill="#171717">Your user</text><text x="150.0" y="192.0" text-anchor="middle" font-size="13" fill="#171717" opacity=".75">sends a message</text><rect x="390" y="110" width="220" height="120" rx="18" fill="#6964ff"/><text x="500.0" y="166.0" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Telegram</text><text x="500.0" y="192.0" text-anchor="middle" font-size="13" fill="#fff" opacity=".75">Bot API</text><rect x="740" y="110" width="220" height="120" rx="18" fill="#171717"/><text x="850.0" y="166.0" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Your server</text><text x="850.0" y="192.0" text-anchor="middle" font-size="13" fill="#fff" opacity=".75">runs your bot code</text><line x1="262" y1="150" x2="388" y2="150" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="325" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">1 message</text><line x1="612" y1="150" x2="738" y2="150" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="675" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">2 update</text><line x1="738" y1="196" x2="612" y2="196" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="675" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">3 sendMessage</text><line x1="388" y1="196" x2="262" y2="196" stroke="#171717" stroke-width="2.5" marker-end="url(#a)"/><text x="325" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#66645f">4 reply</text><text x="500" y="290" text-anchor="middle" font-size="14" fill="#66645f">Your server receives updates by long polling (getUpdates) or by a webhook (setWebhook).</text></svg>