<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">What one Telegram Star is worth</title><desc id="d">Buyers typically pay between 1.3 and 2 cents per Star in the app, while a bot developer receives 1.3 cents per Star. Examples: 1,000 Stars is about 13 dollars, a 150-Star subscription about 1.95 dollars a month, a 750-Star subscription about 9.75 dollars a month.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="330" rx="20" fill="#fff" stroke="#e7e5df"/><text x="40" y="52" font-size="22" font-weight="800" fill="#171717">What one Star is worth</text><text x="40" y="100" font-size="15" font-weight="700" fill="#171717">Buyer pays in the app</text><rect x="260" y="78" width="520" height="34" rx="9" fill="#d9d7d0"/><text x="794" y="101" font-size="16" font-weight="800" fill="#171717">about $0.013 to $0.02</text><text x="40" y="152" font-size="15" font-weight="700" fill="#171717">You receive</text><rect x="260" y="130" width="338" height="34" rx="9" fill="#6964ff"/><text x="612" y="153" font-size="16" font-weight="800" fill="#171717">$0.013</text><line x1="40" y1="196" x2="960" y2="196" stroke="#e7e5df"/><text x="40" y="240" font-size="30" font-weight="850" fill="#171717">$13</text><text x="40" y="268" font-size="14" fill="#66645f">1,000 Stars</text><text x="360" y="240" font-size="30" font-weight="850" fill="#171717">$1.95 / mo</text><text x="360" y="268" font-size="14" fill="#66645f">150-Star subscription</text><text x="680" y="240" font-size="30" font-weight="850" fill="#171717">$9.75 / mo</text><text x="680" y="268" font-size="14" fill="#66645f">750-Star subscription</text><text x="40" y="306" font-size="12" fill="#8a8883">Developer rate before Fragment and exchange fees. Rates and thresholds can change.</text></svg>