<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Kiver">
<rect width="256" height="256" fill="#fff"/>
<defs>
<style>
@keyframes kiverSplashSpin{to{transform:rotate(360deg)}}
@keyframes kiverSplashBreathe{0%,100%{transform:scale(.94) rotate(-2deg)}50%{transform:scale(1.04) rotate(2deg)}}
.ring{transform-origin:128px 128px;animation:kiverSplashSpin 1.15s linear infinite}
.mark{transform-box:fill-box;transform-origin:center;animation:kiverSplashBreathe 1.8s ease-in-out infinite}
</style>
</defs>
<g class="ring" fill="none" stroke="#d9d5ce" stroke-width="2">
<circle cx="128" cy="128" r="108"/>
