<rect x="54" y="91" width="148" height="116" rx="43" fill="#090909"/>
<rect x="75" y="112" width="106" height="45" rx="23" fill="#fff"/>
<circle cx="98" cy="134" r="9" fill="#090909"/>
<circle cx="158" cy="134" r="9" fill="#090909"/>
<circle cx="127" cy="169" r="22" fill="#fff"/>
<circle cx="127" cy="169" r="12" fill="#090909"/>
<path d="M143 185 L160 202" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
</g>
</svg>