<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/app.css"><title>Sign in or create an account — Kiver</title><link rel="icon" href="/icon-512.png"><link rel="apple-touch-icon" href="/icon-512.png"><meta name="theme-color" content="#ffffff"></head><body><main class="auth"><div class="auth-wrap"><a class="brand auth-brand" href="/"><img class="brand-mark brand-logo" src="/icon-512.png" alt="Kiver"><span>Kiver</span></a><div class="auth-card"><span class="eyebrow">KIVER ACCOUNT</span><h1 id="authTitle">Welcome back.</h1><p id="authLead">Sign in to launch Telegram tools, upvote discoveries and join the community.</p><form id="authForm"><label>Email address<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required></label><button class="dark-button" type="submit" id="authSubmit">Sign in <span>→</span></button><p id="authStatus" class="form-status"></p></form><div class="auth-divider"><span>or</span></div><button class="auth-switch" id="toggleAuth">Create a Kiver account</button></div><p class="auth-note">One account works for discovering, voting, commenting and listing.</p></div></main><script src="/app.js" defer></script></body></html>
