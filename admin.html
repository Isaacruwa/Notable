<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kiver Admin</title><link rel="stylesheet" href="/app.css"><style>
.admin-page{max-width:1184px;margin:auto;padding:60px 24px 110px}.admin-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:38px}.admin-head h1{font-size:56px;letter-spacing:-.06em;line-height:1;margin:0}.admin-muted{color:#777}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:45px}.admin-stat,.admin-row{border:1px solid #e5e2dc;border-radius:14px;background:#fff}.admin-stat{padding:18px}.admin-stat label{display:block;font-size:11px;color:#8b8780;letter-spacing:.1em;font-weight:800}.admin-stat strong{display:block;font-size:31px;margin:6px 0}.admin-stat small{color:#96928b}.admin-section{border-top:1px solid #e7e5df;padding-top:32px}.admin-tools{display:flex;gap:8px;justify-content:space-between;margin:20px 0}.admin-tools input{width:min(480px,100%);padding:11px;border:1px solid #d9d5ce;border-radius:9px;font:inherit}.admin-tools button,.admin-action{border:1px solid #d9d5ce;background:#fff;border-radius:8px;padding:9px 12px;font-weight:750;cursor:pointer}.admin-tools .active,.admin-action.dark{background:#171717;color:#fff}.admin-filter{display:flex;gap:6px}.admin-rows{display:grid;gap:10px}.admin-row{padding:15px;display:grid;grid-template-columns:62px 1fr auto;gap:15px;align-items:center}.admin-logo{width:62px;height:62px;border-radius:12px;background:#f0eeea;display:grid;place-items:center;overflow:hidden;font-weight:850;font-size:22px}.admin-logo img{width:100%;height:100%;object-fit:cover}.admin-row h3{margin:0;font-size:17px}.admin-row p{margin:4px 0;color:#777;font-size:13px}.admin-meta{font-size:11px;color:#98948c}.admin-actions{display:flex;gap:7px}.admin-error{padding:14px;border:1px solid #efd1d1;background:#fff4f4;color:#8a4141;border-radius:10px;margin-bottom:20px}@media(max-width:800px){.admin-stats{grid-template-columns:1fr 1fr}.admin-head{align-items:start;flex-direction:column;gap:15px}.admin-tools{flex-direction:column}.admin-tools input{width:100%}.admin-row{grid-template-columns:52px 1fr}.admin-logo{width:52px;height:52px}.admin-actions{grid-column:1/-1}}@media(max-width:520px){.admin-head h1{font-size:43px}}
</style></head><body><header class="nav"><a class="brand" href="/">Kiver</a><a class="nav-link" href="/">Back to site</a></header><main class="admin-page"><div id="error" class="admin-error" hidden></div><div class="admin-head"><div><span class="eyebrow">KIVER ADMIN</span><h1>Control the marketplace.</h1><p class="admin-muted">Feature listings, grant verification, moderate visibility and monitor the platform.</p></div><button class="admin-action dark" id="refresh">Refresh</button></div><section class="admin-stats" id="stats"></section><section class="admin-section"><span class="eyebrow">FEATURED DISCOVERY</span><h2>Control Top Discoveries.</h2><p class="admin-muted">Featuring a listing puts it in Top Discoveries and grants the blue Kiver verified badge.</p><div class="admin-tools"><input id="search" placeholder="Search listings, handles or makers"><div class="admin-filter"><button class="active" data-f="">All</button><button data-f="featured">Featured</button><button data-f="verified">Verified</button><button data-f="hidden">Hidden</button></div></div><div class="admin-rows" id="rows"></div></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])),api=async(u,o)=>{const r=await fetch(u,{credentials:"same-origin",...(o||{})});let d;try{d=await r.json()}catch{throw Error("Admin service unavailable.")}if(!r.ok||d.error)throw Error(d.error||"Request failed.");return d};let filter="",timer;async function load(){try{$("#error").hidden=true;const x=await api("/api/admin?action=stats");$("#stats").innerHTML=[["Users",x.users,x.newUsers+" new this week"],["Listings",x.listings,x.newListings+" new this week"],["Featured",x.featured,"Homepage curated"],["Verified",x.verified,"Kiver badges"],["Upvotes",x.upvotes,"Community"],["Reviews",x.reviews,"Community"],["Comments",x.comments,"Community"],["Status","LIVE","Admin controls"]].map(a=>'<div class="admin-stat"><label>'+a[0]+'</label><strong>'+a[1]+'</strong><small>'+a[2]+'</small></div>').join("");const q=encodeURIComponent($("#search").value.trim()),d=await api("/api/admin?action=listings&filter="+encodeURIComponent(filter)+(q?"&q="+q:""));$("#rows").innerHTML=d.listings.length?d.listings.map(b=>'<article class="admin-row"><div class="admin-logo">'+(b.image_url?'<img src="'+esc(b.image_url)+'" alt="">':esc((b.name||"B").charAt(0)))+'</div><div><h3>'+esc(b.name)+(b.verified?'<span class="verified-badge">✓</span>':"")+'</h3><p>'+esc(b.description||b.about||"Telegram tool")+'</p><div class="admin-meta">@'+esc(b.telegram_username)+' · ↑ '+(b.upvotes||0)+' · '+esc(b.status)+'</div></div><div class="admin-actions"><button class="admin-action" data-feature="'+esc(b.slug)+'">'+(b.featured?"Remove feature":"Feature + verify")+'</button><button class="admin-action" data-status="'+esc(b.slug)+'">'+(b.status==="approved"?"Hide":"Publish")+'</button></div></article>').join(""):'<p class="admin-muted">No listings match this view.</p>';bind()}catch(e){if(e.message.includes("Admin access")||e.message.includes("Sign in"))location.href="/login.html?next=/admin";else{$("#error").textContent=e.message;$("#error").hidden=false}}}function bind(){document.querySelectorAll("[data-feature]").forEach(b=>b.onclick=async()=>{try{await api("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"feature",slug:b.dataset.feature,featured:b.textContent.includes("Feature +")})});load()}catch(e){alert(e.message)}});document.querySelectorAll("[data-status]").forEach(b=>b.onclick=async()=>{try{await api("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"status",slug:b.dataset.status,status:b.textContent==="Hide"?"hidden":"approved"})});load()}catch(e){alert(e.message)}})}$("#refresh").onclick=load;$("#search").oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("active",x===b));load()});load();</script></body></html>
